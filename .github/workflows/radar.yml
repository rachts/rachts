name: Update radar charts

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Match the other default-branch writers; never cancel a running publisher.
concurrency:
  group: profile-assets-${{ github.repository }}
  cancel-in-progress: false

jobs:
  radar:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate radar charts
        run: python scripts/radar.py
      - name: Publish only the radar SVGs
        shell: bash
        run: |
          set -euo pipefail
          files=(assets/radar-skills.svg assets/radar-languages.svg)
          for file in "${files[@]}"; do test -s "$file"; done
          # Fetch again after rendering; isolate publication from generator files.
          git fetch origin "refs/heads/$DEFAULT_BRANCH"
          publish="$RUNNER_TEMP/radar-publish"
          git worktree add --detach "$publish" FETCH_HEAD
          for file in "${files[@]}"; do install -D -m 644 "$file" "$publish/$file"; done
          git -C "$publish" config user.name 'github-actions[bot]'
          git -C "$publish" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$publish" add -- "${files[@]}"
          if git -C "$publish" diff --cached --quiet; then exit 0; fi
          git -C "$publish" commit -m 'chore: refresh radar charts'
          for attempt in 1 2 3; do
            if git -C "$publish" push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then exit 0; fi
            git -C "$publish" fetch origin "refs/heads/$DEFAULT_BRANCH"
            git -C "$publish" rebase FETCH_HEAD
          done
          exit 1
